name: remote_codes
version: "0.2.2"
description: >
  Flipper Zero IR library plus BLE protocol notes: pack layout, photo cleanup
  (including dense rear I/O cutouts), FCC plates, README tree, raw-IR decode,
  and GATT framing helpers (HeatGenie E-10 waits for cooldown, then unique-random
  vent/ON; encode_heatgenie.py vent/clear).

kinds: [agent]

paths:
  agent_skills: .claude/skills/
  agent_rules: .claude/rules/
  infrared: Infrared/
  bluetooth: Bluetooth/

install:
  note: >
    Open this repo in Claude Code or Grok so `.claude/skills` and `.claude/rules`
    load. Grok also follows `.grok/skills` (symlinks to `.claude/skills`).

agent_skills_included: 5
agent_rules_included: 2
