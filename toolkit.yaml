name: remote_codes
version: "0.3.5"
description: >
  Flipper Zero IR library plus BLE, LAN, and USB serial protocol notes: pack
  layout, photo cleanup (including dense rear I/O cutouts and rembg BiRefNet
  manual pages), FCC plates, README tree, raw-IR decode, GATT framing helpers
  (HeatGenie E-10 waits for cooldown, then unique-random vent/ON;
  encode_heatgenie.py vent/clear/gear; HeatGenie-S3 UART Afterburner 0x76/0x78;
  JBD encode_jbd.py FF00; NIIMBOT B1 encode_niimbot.py 55 55 XOR on
  e7810a71/bef8d6c9; Nelko P21 encode_nelko.py TSPL2 on RFCOMM ch1
  (GATT ff02 same bytes; CUPS printer-driver-nelko nelko://dash-MAC +
  rastertonelko); Aimotech D30 encode_aimotech.py GS v 0 on SPP 00001101
  (CUPS printer-driver-aimotech aimotech://dash-MAC + rastertoaimotech);
  label-bridge
  IPP/AirPrint client for those three), EyeBond/SmartESS
  local hijack (UDP 58899 / TCP 8899,
  SRNE Modbus RTU; encode_smartess.py), and USB UART/HID/RS485/CAN inverter+BMS
  (SRNE encode_srne.py, Voltronic QPIGS). Infrared catalog includes ETD-360,
  BLS-70-25RC, and FUDONI GC888. Trees split by connection: Bluetooth/ vs
  Network/ vs Serial/.

kinds: [agent]

paths:
  agent_skills: .claude/skills/
  agent_rules: .claude/rules/
  infrared: Infrared/
  bluetooth: Bluetooth/
  network: Network/
  serial: Serial/

install:
  note: >
    Open this repo in Claude Code or Grok so `.claude/skills` and `.claude/rules`
    load. Grok also follows `.grok/skills` (symlinks to `.claude/skills`).

agent_skills_included: 5
agent_rules_included: 2
