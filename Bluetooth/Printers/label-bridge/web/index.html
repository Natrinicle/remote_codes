<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Label printer</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 18px/1.4 system-ui, sans-serif; margin: 1.5rem auto; max-width: 36rem; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    button, input[type=file] { font: inherit; }
    button { background: #1a6; color: #fff; border: 0; border-radius: 8px; padding: .7rem 1.2rem; }
    button:disabled { opacity: .5; }
    .card { border: 1px solid #8884; border-radius: 12px; padding: 1rem; margin: 1rem 0; }
    pre { white-space: pre-wrap; font-size: 14px; }
    .hint { opacity: .75; font-size: 15px; }
  </style>
</head>
<body>
  <h1>Label printer</h1>
  <p class="hint">This page runs on a computer that is already talking to the
    printer over Bluetooth. Phones on the same Wi‑Fi can print from here
    without an App Store app.</p>
  <div class="card">
    <p id="status">Loading…</p>
    <form id="form">
      <p><input id="file" type="file" accept="image/*,application/pdf" required></p>
      <p>
        Copies
        <input id="copies" type="number" min="1" max="5" value="1" style="width:4rem">
      </p>
      <p><button type="submit">Print</button></p>
    </form>
    <pre id="log"></pre>
  </div>
  <script>
    const log = (t) => { document.getElementById("log").textContent = t; };
    fetch("/status").then(r => r.text()).then(t => {
      document.getElementById("status").textContent = t.trim();
    }).catch(() => {
      document.getElementById("status").textContent = "Bridge not reachable.";
    });
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = document.getElementById("file").files[0];
      const copies = document.getElementById("copies").value || "1";
      if (!file) return;
      const body = new FormData();
      body.append("file", file);
      log("Sending…");
      try {
        const res = await fetch("/print?copies=" + encodeURIComponent(copies), {
          method: "POST",
          body
        });
        log(await res.text());
      } catch (err) {
        log(String(err));
      }
    });
  </script>
</body>
</html>
