[platformio]
extra_configs = platformio_override.ini

[env:s3-super-mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_ota.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DHEATER_TX_GPIO=5
  -DHEATER_RX_GPIO=6
  -DCORE_DEBUG_LEVEL=1
; Blue-wire TX is Afterburner 24-byte / 25000 / CRC-16/MODBUS.
; heatgenie.cpp is CRC/classify only for the listen-only sniffer (no AA TX).
; GitLab: mrjones.id.au/bluetoothheater src/Protocol/{Protocol,TxManage,BlueWireTask}.
lib_deps =
  h2zero/NimBLE-Arduino@^2.2.3

; After the USB flash of partitions_ota.csv, later images go over WiFi.
; Auth is in gitignored platformio_override.ini (OTA_PASSWORD).
[env:s3-ota]
extends = env:s3-super-mini
upload_protocol = espota
upload_port = heatgenie-s3.local
